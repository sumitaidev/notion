<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Productivity Dock</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            /* General Theme Variables */
            --bg-color: #ffffff;
            --btn-bg: #fbfbfa;
            --btn-border: #ededed;
            --btn-hover: #f1f1ef;
            --text-color: #37352f;
            --text-muted: #787774;
            
            /* Icon Brand Colors */
            --mail-color: #ea4335;
            --calendar-color: #4285f4;
            --keep-color: #fbbc05;
            --tasks-color: #1a73e8;
            --notion-color: #000000;
            --gemini-color: #8e62f0;
            --chatgpt-color: #10a37f;
            --drive-color: #34a853;
        }

        /* Notion Dark Mode Theme Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #191919;
                --btn-bg: #202020;
                --btn-border: #2f2f2f;
                --btn-hover: #2a2a2a;
                --text-color: rgba(255, 255, 255, 0.9);
                --text-muted: #9b9b9b;
                --notion-color: #ffffff;
                --gemini-color: #a482f3;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Updated to a Grid to handle 8 items beautifully */
        .dock-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 72px;
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 10px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .dock-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .dock-btn:active {
            transform: translateY(0);
        }

        .dock-btn .material-symbols-outlined {
            font-size: 24px;
        }

        /* Applying Custom Icon Colors */
        .dock-btn.notion { --icon-color: var(--notion-color); }
        .dock-btn.gemini { --icon-color: var(--gemini-color); }
        .dock-btn.chatgpt { --icon-color: var(--chatgpt-color); }
        .dock-btn.drive { --icon-color: var(--drive-color); }
        .dock-btn.mail { --icon-color: var(--mail-color); }
        .dock-btn.calendar { --icon-color: var(--calendar-color); }
        .dock-btn.keep { --icon-color: var(--keep-color); }
        .dock-btn.tasks { --icon-color: var(--tasks-color); }

        .dock-btn .icon-wrapper {
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .hint-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 16px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="dock-container">
        <!-- New Tools -->
        <div class="dock-btn notion" id="btn-notion">
            <div class="icon-wrapper"><span class="material-symbols-outlined">description</span></div>
            <span class="btn-label">Notion</span>
        </div>

        <div class="dock-btn gemini" id="btn-gemini">
            <div class="icon-wrapper"><span class="material-symbols-outlined">auto_awesome</span></div>
            <span class="btn-label">Gemini</span>
        </div>

        <div class="dock-btn chatgpt" id="btn-chatgpt">
            <div class="icon-wrapper"><span class="material-symbols-outlined">smart_toy</span></div>
            <span class="btn-label">ChatGPT</span>
        </div>

        <div class="dock-btn drive" id="btn-drive">
            <div class="icon-wrapper"><span class="material-symbols-outlined">add_to_drive</span></div>
            <span class="btn-label">Drive</span>
        </div>

        <!-- Original Tools -->
        <div class="dock-btn mail" id="btn-mail">
            <div class="icon-wrapper"><span class="material-symbols-outlined">mail</span></div>
            <span class="btn-label">Mail</span>
        </div>

        <div class="dock-btn calendar" id="btn-calendar">
            <div class="icon-wrapper"><span class="material-symbols-outlined">calendar_month</span></div>
            <span class="btn-label">Calendar</span>
        </div>

        <div class="dock-btn keep" id="btn-keep">
            <div class="icon-wrapper"><span class="material-symbols-outlined">lightbulb</span></div>
            <span class="btn-label">Keep</span>
        </div>

        <div class="dock-btn tasks" id="btn-tasks">
            <div class="icon-wrapper"><span class="material-symbols-outlined">task_alt</span></div>
            <span class="btn-label">Tasks</span>
        </div>
    </div>

    <div class="hint-text">1-Click: Home | Double-Click: Capture New</div>

    <script>
        // Setup direct configurations for single & double clicks
        const links = {
            'btn-notion': {
                single: 'https://www.notion.so',
                double: 'https://www.notion.so/new' // Jumps straight to creating a new page
            },
            'btn-gemini': {
                single: 'https://gemini.google.com',
                double: 'https://gemini.google.com/app'
            },
            'btn-chatgpt': {
                single: 'https://chatgpt.com',
                double: 'https://chatgpt.com/?model=gpt-4o' // Opens a fresh chat explicitly 
            },
            'btn-drive': {
                single: 'https://drive.google.com',
                double: 'https://drive.google.com/drive/u/0/my-drive'
            },
            'btn-mail': {
                single: 'https://mail.google.com',
                double: 'https://mail.google.com/mail/u/0/#inbox?compose=new'
            },
            'btn-calendar': {
                single: 'https://calendar.google.com',
                double: 'https://calendar.google.com/calendar/u/0/r/eventedit'
            },
            'btn-keep': {
                single: 'https://keep.google.com',
                double: 'https://keep.google.com/#create'
            },
            'btn-tasks': {
                single: 'https://assistant.google.com/tasks', 
                double: 'https://assistant.google.com/tasks'
            }
        };

        // Click Handler preventing single-click from triggering during double-clicks
        Object.keys(links).forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return; // Safeguard if button is removed
            let clickTimer = null;

            btn.addEventListener('click', () => {
                if (clickTimer !== null) return; // Skip if a double click is processing

                clickTimer = setTimeout(() => {
                    window.open(links[id].single, '_blank');
                    clickTimer = null;
                }, 250); // Delay window to listen for second tap
            });

            btn.addEventListener('dblclick', () => {
                clearTimeout(clickTimer);
                clickTimer = null;
                window.open(links[id].double, '_blank');
            });
        });
    </script>
</body>
</html>
